plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jovoc.facecampresentationrecorder'
    compileSdk 36

    defaultConfig {
        applicationId "com.jovoc.facecampresentationrecorder"
        minSdk 31
        targetSdk 36
        versionCode 4
        versionName "1.0"

        // Pages on WEB_BASE_URL (set per build type). Assumed until the backend work reports final URLs.
        buildConfigField 'String', 'CHANNELS_PATH', '"/launches"'
        buildConfigField 'String', 'PRIVACY_PATH', '"/privacy"'
        buildConfigField 'String', 'TERMS_PATH', '"/terms"'
    }

    buildTypes {
        debug {
            // Backend for local testing: 10.0.2.2 is the host machine from the emulator;
            // use the LAN IP of the dev machine on a real phone.
            buildConfigField 'String', 'API_BASE_URL', '"http://10.0.2.2:3000"'
            // Website the app links to (connect channels, privacy, terms). Debug: the local web app.
            buildConfigField 'String', 'WEB_BASE_URL', '"http://10.0.2.2:3000"'
        }
        release {
            // TODO(PROD-URLS): the production API and website hosts are not confirmed yet
            // (proposal: https://api.nanybot.com). Both must be https; a release build refuses
            // anything else. Replace these two values only; nothing else needs to change.
            buildConfigField 'String', 'API_BASE_URL', '"https://backend.invalid"'
            buildConfigField 'String', 'WEB_BASE_URL', '"https://web.invalid"'
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    aaptOptions {
        noCompress 'tflite'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // TensorFlow Lite for real-time background segmentation
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-api:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-gpu-api:2.14.0'

    // Backend client (sign-in / tokens) and encrypted token storage
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Background upload/publish jobs that survive the app being closed
    implementation 'androidx.work:work-runtime:2.9.1'

    // Room DB
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Glide Image Loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // CameraX
    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.camera:camera-video:${camerax_version}"

    // FFmpegKit for post-recording video cropping (maintained community release)
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.7'
    implementation 'com.arthenica:smart-exception-java:0.2.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.json:json:20231013'
}