plugins {
    id 'com.android.application'
}

android {
    namespace 'com.customscreen.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.customscreen.app"
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // No external dependencies needed - uses only Android SDK built-in APIs
}